spring:
  application:
    name: API-GATEWAY
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins: "http://localhost:3000"
            allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
            allowed-headers: "*"
            allow-credentials: true
      routes:
        - id: USER-MANAGEMENT-SERVICE
          uri: lb://USER-MANAGEMENT-SERVICE
          predicates:
            - Path=/api/v1/auth/**
        - id: USER-MANAGEMENT-SERVICE
          uri: lb://USER-MANAGEMENT-SERVICE
          predicates:
            - Path=/api/v1/users/**
        - id: INTERVIEW-MANAGEMENT-SERVICE
          uri: lb://INTERVIEW-MANAGEMENT-SERVICE
          predicates:
            - Path=/api/v1/interviews/**
        - id: QUESTION-MANAGEMENT-SERVICE
          uri: lb://QUESTION-MANAGEMENT-SERVICE
          predicates:
            - Path=/api/v1/questions/**
        - id: REPORT-GENERATION-SERVICE
          uri: lb://REPORT-GENERATION-SERVICE
          predicates:
            - Path=/api/v1/reports/**
server:
  port: 9191
eureka:
  client:
    service-url:
      default-zone: http://localhost:8761/eureka/

logging:
  level:
    com.aipoweredinterviewmonitoringsystem.api_gateway: DEBUG
    org.springframework.cloud.gateway: DEBUG
    reactor.netty: DEBUG
  file:
    name: logs/gateway.log