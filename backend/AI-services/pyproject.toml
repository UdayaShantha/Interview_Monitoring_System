[tool.poetry]
name = "ai-services-project"
version = "0.1.0"
description = "A project for AI services including all necessary Python modules and codes."
authors = ["Udaya Shantha <your-email@example.com>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.9"

# Core Machine Learning and Deep Learning Libraries
numpy = "^1.24.0"
pandas = "^2.0.0"
scikit-learn = "^1.3.0"
tensorflow = "^2.13.0"
torch = "^2.0.0"
torchvision = "^0.15.0"

# Natural Language Processing Libraries
nltk = "^3.8.0"
spacy = "^3.6.0"
transformers = "^4.30.0"

# Computer Vision Libraries
opencv-python = "^4.8.0"
Pillow = "^9.5.0"

# Other AI Libraries
xgboost = "^1.7.0"
lightgbm = "^3.3.0"
catboost = "^1.2.0"

# Utilities and Supporting Libraries
matplotlib = "^3.8.0"
seaborn = "^0.12.0"
scipy = "^1.11.0"
joblib = "^1.4.0"

# Data Handling and Preprocessing
pyyaml = "^6.0.0"
tqdm = "^4.65.0"

# Development and Testing
pytest = "^7.4.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
